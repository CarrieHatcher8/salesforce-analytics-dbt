version: 2

models:
  - name: dim_account
    description: "BI-ready Account dimension."

    columns:
      - name: account_id
        description: "Unique Account identifier."
        data_tests:
          - not_null
          - unique

  - name: dim_sales_rep
    description: "BI-ready Sales Rep dimension."

    columns:
      - name: sales_rep_id
        description: "Unique Sales Rep identifier."
        data_tests:
          - not_null
          - unique

  - name: fct_opportunity
    description: "BI-ready Opportunity fact table at one row per Opportunity."

    columns:
      - name: opportunity_id
        description: "Unique Opportunity identifier."
        data_tests:
          - not_null
          - unique

      - name: account_id
        description: "Account associated with the Opportunity."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_id

      - name: sales_rep_id
        description: "Sales Rep who owns the Opportunity."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sales_rep')
                field: sales_rep_id

  - name: fct_contract_performance_monthly
    description: "BI-ready financial performance fact table at one row per contract per reporting month."

    columns:
      - name: contract_id
        description: "Contract represented by the monthly financial activity."
        data_tests:
          - not_null

      - name: reporting_month
        description: "Month in which the financial activity occurred."
        data_tests:
          - not_null

      - name: booking_amount
        description: "Contract value booked during the reporting month."
        data_tests:
          - not_null

      - name: recognized_revenue
        description: "Revenue recognized during the reporting month."
        data_tests:
          - not_null

      - name: cash_collected
        description: "Cash collected during the reporting month."
        data_tests:
          - not_null
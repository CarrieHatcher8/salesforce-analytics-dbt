# Model layers are separated by responsibility so transformation logic,
# business rules, and governed reporting outputs remain clearly defined.
# Schema routing is handled through the custom generate_schema_name macro.

name: 'salesforce_analytics'
version: '1.0.0'

profile: 'salesforce_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  salesforce_analytics:
    staging:
      +schema: STAGING
      +materialized: view

    intermediate:
      +schema: INTERMEDIATE
      +materialized: view

    marts:
      +schema: MARTS
      +materialized: view